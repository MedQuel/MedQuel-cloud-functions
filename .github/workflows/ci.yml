name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - checkStreaks
          - contestLifecycle
          - evaluateBadges
          - generateContests
          - ingestQuestions
          - onQuizCompleted
          - paymentWebhook
          - rollupLeaderboard
          - sendNotification
          - weeklyStudyPlanRegeneration

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build
